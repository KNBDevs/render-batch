name: stats
on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -U yt-dlp
      - run: python tools/stats.py | tee stats.txt
      - run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add state/stats.json
          git diff --cached --quiet || { git commit -qm "update state"; git pull -q --rebase origin main; git push -q origin HEAD:main; }
