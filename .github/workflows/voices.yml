name: voices
on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "47 10 * * *"
    - cron: "17 14 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      chars:
        description: "Characters"
        default: "pimo,ruki,luma,tuki,moki,bopi,bolita,gruno,narrador,nubi,seda,velo"
permissions:
  contents: write
  actions: write
concurrency:
  group: voices
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: for i in 1 2 3; do timeout 300 sudo apt-get update -qq; timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null && break; sleep 15; done
      - run: pip install -q numpy scipy faster-whisper librosa
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-fw-small-v1
      - run: for i in 1 2 3 4; do python -c "from faster_whisper import WhisperModel; WhisperModel('small', device='cpu', compute_type='int8')" && break; sleep 160; done
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python voices/gemini_bake.py "${{ inputs.chars || 'pimo,ruki,luma,tuki,moki,bopi,bolita,gruno,narrador,nubi,seda,velo' }}"
      - if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add assets/vo && git commit -qm "update assets" && git pull -q --rebase && git push -q || true
      - name: Publish pending intro
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          git pull -q --rebase || true
          if [ "$(cat _missing.txt 2>/dev/null)" = "0" ] && ! jq -e 'index("intro_v2")' state/published.json >/dev/null; then
            gh workflow run build.yml -R "$R" -f template=queue -f deliver=true
          fi
